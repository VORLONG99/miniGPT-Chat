# 模型配置
model:
  name: "gpt-mini"
  vocab_size: 50257
  n_embed: 384
  n_head: 6
  n_layer: 6
  block_size: 256
  dropout: 0.2

# 训练配置
training:
  batch_size: 32
  learning_rate: 3e-4
  max_epochs: 10
  warmup_steps: 100
  weight_decay: 0.01
  gradient_clip: 1.0
  eval_interval: 100
  save_interval: 500
  
  # 学习率调度
  lr_scheduler:
    type: "cosine"
    min_lr: 3e-5

# 数据配置
data:
  train_path: "./data/training/train_data.json"
  val_split: 0.1
  max_samples: null

# 优化配置
optimizer:
  type: "adamw"
  betas: [0.9, 0.95]

# 硬件配置
device: "auto"  # auto / cuda / cpu
precision: "fp32"  # fp32 / fp16 / bf16

# 日志配置
logging:
  log_dir: "./logs"
  log_interval: 10
  tensorboard: true

# 检查点配置
checkpoint:
  save_dir: "./models/checkpoints"
  save_best_only: false
  max_checkpoints: 5
